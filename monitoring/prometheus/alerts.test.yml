rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="cloud",instance="cloud:8001"}'
        values: '1 0+0x12 1+0x12'
    alert_rule_test:
      - eval_time: 1m
        alertname: ServiceUnavailable
        exp_alerts: []
      - eval_time: 2m15s
        alertname: ServiceUnavailable
        exp_alerts:
          - exp_labels:
              job: cloud
              instance: cloud:8001
              severity: critical
            exp_annotations:
              summary: cloud is unavailable
      - eval_time: 4m
        alertname: ServiceUnavailable
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'device_messages_total{job="gateway",instance="gateway:8000"}'
        values: '0+100x40'
      - series: 'cloud_forward_attempts_total{job="gateway",instance="gateway:8000"}'
        values: '0+100x40'
      - series: 'cloud_forward_failures_total{job="gateway",instance="gateway:8000"}'
        values: '0+6x40'
      - series: 'sensor_fault_readings_total{job="gateway",instance="gateway:8000",type="crc_failure"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudDeliveryFailures
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: Cloud forwarding failure ratio exceeds 5 percent
      - eval_time: 10m
        alertname: SensorFaultRate
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'device_messages_total{job="gateway",instance="gateway:8000"}'
        values: '0+100x40'
      - series: 'cloud_forward_attempts_total{job="gateway",instance="gateway:8000"}'
        values: '0+100x40'
      - series: 'cloud_forward_failures_total{job="gateway",instance="gateway:8000"}'
        values: '0+1x40'
      - series: 'sensor_fault_readings_total{job="gateway",instance="gateway:8000",type="crc_failure"}'
        values: '0+25x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudDeliveryFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: SensorFaultRate
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: Sensor sentinel fault rate exceeds 20 percent
  - interval: 15s
    input_series:
      - series: 'sensor_disconnected_devices{job="gateway",instance="gateway:8000"}'
        values: '0 1+0x4 0+0x6'
      - series: 'sensor_silent_devices{job="gateway",instance="gateway:8000"}'
        values: '0 1+0x4 0+0x6'
      - series: 'sensor_suspected_stuck_devices{job="gateway",instance="gateway:8000"}'
        values: '0 1 0+0x9'
      - series: 'sensor_stuck_episodes_total{job="gateway",instance="gateway:8000"}'
        values: '0 1+0x30'
    alert_rule_test:
      - eval_time: 45s
        alertname: SensorDisconnected
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: One or more devices report a disconnected sensor
      - eval_time: 2m
        alertname: SensorDisconnected
        exp_alerts: []
      - eval_time: 45s
        alertname: DeviceSilent
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: One or more previously observed devices stopped reporting
      - eval_time: 2m
        alertname: DeviceSilent
        exp_alerts: []
      - eval_time: 15s
        alertname: SensorStuckSuspected
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: One or more sensors repeatedly report the same temperature
      - eval_time: 1m
        alertname: SensorStuckSuspected
        exp_alerts:
          - exp_labels:
              job: gateway
              instance: gateway:8000
              severity: warning
            exp_annotations:
              summary: One or more sensors repeatedly report the same temperature
      - eval_time: 6m
        alertname: SensorStuckSuspected
        exp_alerts: []
