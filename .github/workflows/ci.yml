name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all current Python sources
        run: python -m compileall -q -f cloud gateway device monitoring scripts tests .github/scripts

  test-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check v3 dependencies import
        run: python -c "import fastapi, requests, prometheus_client; from kyber_py.ml_kem.default_parameters import ML_KEM_768; from cryptography.hazmat.primitives.ciphers.aead import AESGCM"
      - name: Run device tests
        run: python -m pytest device/tests -v --junitxml=device-report.xml
      - name: Summarize results and enforce skip budgets
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/junit_summary.py --title "device tests" \
            --max-skipped 0 --max-xfailed 0 device-report.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-device
          path: device-report.xml
          if-no-files-found: error
          retention-days: 14

  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check v3 dependencies import
        run: python -c "import fastapi, requests, prometheus_client; from kyber_py.ml_kem.default_parameters import ML_KEM_768; from cryptography.hazmat.primitives.ciphers.aead import AESGCM"
      - name: Run gateway tests
        run: python -m pytest gateway/tests -v --junitxml=gateway-report.xml
      - name: Summarize results and enforce skip budgets
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/junit_summary.py --title "gateway tests" \
            --max-skipped 0 --max-xfailed 0 gateway-report.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-gateway
          path: gateway-report.xml
          if-no-files-found: error
          retention-days: 14

  test-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check v3 dependencies import
        run: python -c "import fastapi, requests, prometheus_client; from kyber_py.ml_kem.default_parameters import ML_KEM_768; from cryptography.hazmat.primitives.ciphers.aead import AESGCM"
      - name: Run cloud tests
        run: python -m pytest cloud/tests -v --junitxml=cloud-report.xml
      - name: Summarize results and enforce skip budgets
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/junit_summary.py --title "cloud tests" \
            --max-skipped 0 --max-xfailed 0 cloud-report.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-cloud
          path: cloud-report.xml
          if-no-files-found: error
          retention-days: 14

  test-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run tooling regression tests
        run: python -m pytest tests/tooling -v --junitxml=tooling-report.xml
      - name: Summarize results and enforce skip budgets
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/junit_summary.py --title "tooling tests" \
            --max-skipped 0 --max-xfailed 0 tooling-report.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-tooling
          path: tooling-report.xml
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: [static-checks, test-device, test-gateway, test-cloud, test-tooling, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Exercise encrypted delivery and v3 measurement scenarios
        run: python scripts/evaluation/run_isolated.py --samples 6 --json-out v3-evaluation.json
      - name: Upload raw measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-evaluation
          path: v3-evaluation.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional Compose overlay
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet
      - name: Validate Prometheus configuration and alert behavior
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.0 test rules alerts.test.yml
      - name: Validate notification routing
        run: docker run --rm --entrypoint amtool -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml

  reliability-smoke:
    needs: [test-device, test-gateway, test-cloud, test-tooling, monitoring-config]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Verify persistence, security, sensor state and outage notifications
        run: python scripts/evaluation/verify_reliability.py --json-out reliability-evaluation.json
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-evaluation
          path: reliability-evaluation.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [test-device, test-gateway, test-cloud, test-tooling, build, smoke, monitoring-config, reliability-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/gateway:latest ./gateway
          docker push ghcr.io/${{ steps.repo.outputs.name }}/gateway:latest

      - name: Build and push cloud
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/cloud:latest ./cloud
          docker push ghcr.io/${{ steps.repo.outputs.name }}/cloud:latest

      - name: Build and push device
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/device:latest ./device
          docker push ghcr.io/${{ steps.repo.outputs.name }}/device:latest
