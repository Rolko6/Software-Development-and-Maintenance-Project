name: CI

on:
  push:
  pull_request:

jobs:
  test-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest device/tests -v

  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest gateway/tests -v

  test-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest cloud/tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  publish:
    needs: [test-device, test-gateway, test-cloud, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/gateway:latest ./gateway
          docker push ghcr.io/${{ steps.repo.outputs.name }}/gateway:latest

      - name: Build and push cloud
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/cloud:latest ./cloud
          docker push ghcr.io/${{ steps.repo.outputs.name }}/cloud:latest

      - name: Build and push device
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.name }}/device:latest ./device
          docker push ghcr.io/${{ steps.repo.outputs.name }}/device:latest
