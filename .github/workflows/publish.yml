# Publishes the gateway, cloud, and device images to GHCR (GitHub Container
# Registry). Pushing requires GHCR package permissions on this repository
# (the default GITHUB_TOKEN with `packages: write`, granted below, is
# sufficient for a first push; subsequent pushes may need the resulting
# package's visibility/permissions adjusted in repo settings). This
# workflow only builds and publishes images -- there is no deployment
# target configured yet.
name: Publish images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Guard against a manual workflow_dispatch run from develop: this
    # workflow must never publish images built from that branch.
    if: github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./gateway
          - service: cloud
            context: ./cloud
          - service: device
            context: ./device
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository owner (Rolko6) contains uppercase characters, and
      # GHCR rejects uppercase in an image path. Rather than lowercasing
      # `github.repository` by hand in shell (e.g. `${GITHUB_REPOSITORY,,}`),
      # this uses docker/metadata-action, which lowercases the `images`
      # value automatically and derives consistent tags/labels from it.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
