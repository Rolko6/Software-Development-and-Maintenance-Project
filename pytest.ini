[pytest]
# Root suite.
#
# tests/crypto/ and tests/protected_path/ verify the ML-KEM work and run with
# nothing else started. tests/integration/ drives the running Docker Compose
# stack and fails if it is not up, so the ML-KEM suite is usually run on its
# own:
#
#   .venv/bin/python -m pytest tests/crypto tests/protected_path
#   docker compose up --build -d && .venv/bin/python -m pytest   # everything
#
# Each service also carries its own pytest.ini and tests/ directory, and each
# imports its service as the top-level package `app`. Three different `app`
# packages cannot coexist in one interpreter, so those suites run from their
# own directories:
#
#   cd gateway && ../.venv/bin/python -m pytest
#   cd cloud   && ../.venv/bin/python -m pytest
#   cd device  && ../.venv/bin/python -m pytest
testpaths = tests

norecursedirs = .venv .git .trash __pycache__ .pytest_cache

addopts = -ra --strict-markers

markers =
    integration: drives the running Docker Compose stack over real HTTP
    kat: known-answer test against published NIST ACVP vectors
